<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script defer src="./src/cover.js"></script>
<script defer src="./src/shots.js"></script>
<script defer src="./src/main.js"></script>
</head>
<body>
<header class="masthead">
  <div class="identity"><span class="sun" aria-hidden="true"></span><h1>Sunset<span> Cover Studio</span></h1></div>
  <div class="history-actions"><button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button><button id="surprise">Surprise me</button></div>
  <div class="export-bar"><label class="sr-only" for="format">Export dimensions</label>
    <select id="format"><option value="wide">Landscape · 1920 × 1080</option><option value="tall">Portrait · 1024 × 1280</option><option value="square">Square · 1024 × 1024</option></select>
    <button class="primary" id="export"><span aria-hidden="true">↓</span> Export PNG</button>
    <button id="export-all">Export all sizes</button>
  </div>
</header>
<nav class="steps" aria-label="Editor steps"><span data-step="1" aria-current="step">1 Photos</span> → <span data-step="2">2 Layout &amp; grade</span> → <span data-step="3">3 Export</span></nav>
<main>
  <aside class="tools" aria-label="Composition controls">
    <section>
      <h2>Layout</h2>
      <div class="layout-options" id="layouts" role="group" aria-label="Panel layout"></div>
    </section>
    <section>
      <h2>Photos</h2>
      <div class="photo-actions"><button id="pick" class="add">+ Add photos</button><button id="samples">Try samples</button></div>
      <div class="photo-actions"><button id="auto-fill">Auto-fill</button><button id="spread">Spread</button></div>
      <input id="files" type="file" accept="image/*" multiple hidden>
      <div id="panels" role="group" aria-label="Active panel"></div>
      <label class="slider">Zoom <input id="zoom" type="range" min="1" max="4" step=".01"></label>
      <label class="slider">Rotation <input id="angle" type="range" min="-180" max="180"></label>
      <div class="crop-actions"><button id="reset">Reset crop</button><button id="replace">Replace panel</button></div>
    </section>
  </aside>
  <section id="work" aria-label="Poster workspace">
    <div class="stage-heading"><h2>Cover preview</h2><span id="dimensions"></span></div>
    <div class="viewport"><div class="artboard" id="board"><canvas id="cover" aria-label="Cover preview. Select a panel and drag to reposition its photo."></canvas></div></div>
    <div class="stage-footer"><span id="status" role="status">Drop photos here · Drag a panel to reposition</span><span id="active-panel"></span></div>
  </section>
  <aside class="tools" aria-label="Caption and color controls">
    <section>
      <h2>Caption</h2>
      <label class="field">Title <input id="title" maxlength="55"></label>
      <label class="field">Subtitle <input id="subtitle" maxlength="74"></label>
      <label class="field">Tagline <input id="tagline" maxlength="120"></label>
      <label class="field">Badge / seal text <input id="badge" maxlength="120"></label>
      <label class="field">Volume <input id="volume" maxlength="120"></label>
      <label class="field">Quote <input id="quote" maxlength="120"></label>
      <label class="field">Quote source <input id="quoteSource" maxlength="120"></label>
      <label class="field">Title position <select id="titlePos"><option value="bottom">Bottom</option><option value="over">Over art</option><option value="centre">Centre</option></select></label>
      <div class="type-tools">
        <label class="slider">Size <input id="size" type="range" min="60" max="140"></label>
        <label class="swatch"><span class="sr-only">Title color</span><input id="ink" type="color" title="Title color"></label>
      </div>
    </section>
    <section>
      <h2>Color grade</h2>
      <label class="field">Preset <select id="preset"><option>Vice Sunset</option><option>Neon Night</option><option>Golden Hour</option><option>Comic Ink</option><option>Noir Heat</option></select></label>
      <label class="slider">Neon <input id="neon" type="range" min="0" max="100"></label>
      <label class="slider">Warmth <input id="warm" type="range" min="0" max="100"></label>
      <label class="slider">Vignette <input id="shade" type="range" min="0" max="100"></label>
    </section>
    <section><h2>Stickers &amp; effects</h2><label>Halftone<input type="checkbox" id="halftone"></label><label>Grain<input type="checkbox" id="grain"></label><label>Speed lines<input type="checkbox" id="speedLines"></label><label>Location tags<input type="checkbox" id="locationTags"></label><label>Badge / seal<input type="checkbox" id="badgeSeal"></label><label>Volume chip<input type="checkbox" id="volumeChip"></label><label>Ribbon tagline<input type="checkbox" id="ribbon"></label><label>Quote strip<input type="checkbox" id="quoteStrip"></label></section>
  </aside>
</main>
